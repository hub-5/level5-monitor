name: LEVEL-5 Website Monitor

on:
  schedule:
    # Cada 10 minutos. El mínimo técnico de GitHub Actions es cada 5 minutos
    # ("*/5 * * * *"), pero cuanto más frecuente, más minutos de cómputo
    # consume y más carga genera sobre las webs vigiladas. Ajusta este valor
    # a tu gusto (ver README.md).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para poder commitear state.json

concurrency:
  group: level5-monitor
  cancel-in-progress: false   # evita que dos ejecuciones se pisen si una tarda más de lo normal

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar el nuevo estado en el repositorio
        run: |
          git config user.name "level5-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json

          if git diff --cached --quiet; then
            echo "Sin cambios de estado que commitear."
            exit 0
          fi

          git commit -m "chore: actualizar estado del monitor"

          # Reintenta si otra ejecución ha subido cambios justo antes que
          # nosotros (p. ej. una ejecución manual solapada con la programada).
          # Como el "concurrency" del workflow ya evita que corran dos a la
          # vez, esto es solo un cinturón de seguridad extra.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Estado guardado correctamente."
              exit 0
            fi
            echo "Push rechazado (intento $intento/5), sincronizando y reintentando..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "No se pudo fusionar automáticamente, abortando este intento."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 2 ))
          done

          echo "No se pudo subir el estado tras varios intentos."
          exit 1
